name: iStoreOS-360T7

on:
  workflow_dispatch:
  repository_dispatch:

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-25.12

  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config

  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh

  TZ: Asia/Shanghai

jobs:
  build:

    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc

        sudo docker image prune -af

    - name: Setup Build Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt update

        sudo apt install -y \
        ack antlr3 asciidoc autoconf automake autopoint \
        binutils bison build-essential bzip2 ccache cmake \
        cpio curl device-tree-compiler fastjar flex gawk \
        gettext gcc-multilib g++-multilib git gperf \
        haveged help2man intltool libc6-dev-i386 \
        libelf-dev libfuse-dev libglib2.0-dev \
        libgmp3-dev libltdl-dev libmpc-dev \
        libmpfr-dev libncurses5-dev \
        libncursesw5-dev libpython3-dev \
        libreadline-dev libssl-dev libtool \
        lrzsz mkisofs msmtp ninja-build \
        p7zip p7zip-full patch pkgconf python3 \
        python3-pyelftools python3-setuptools \
        qemu-utils rsync scons squashfs-tools \
        subversion swig texinfo uglifyjs unzip \
        vim wget xmlto xxd zlib1g-dev dwarves

        sudo timedatectl set-timezone "$TZ"

    - name: Clone Source Code
      run: |
        git clone \
          --depth=1 \
          -b $REPO_BRANCH \
          $REPO_URL \
          openwrt

    - name: Cache DL
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: dl-${{ runner.os }}-${{ hashFiles('.config') }}
        restore-keys: |
          dl-${{ runner.os }}-

    - name: Cache Ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}-${{ hashFiles('.config') }}
        restore-keys: |
          ccache-${{ runner.os }}-

    - name: Load Custom Feeds
      run: |
        chmod +x $DIY_P1_SH

        cd openwrt

        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update Feeds
      run: |
        cd openwrt

        ./scripts/feeds update -a

    - name: Install Feeds
      run: |
        cd openwrt

        ./scripts/feeds install -a

    - name: Load Custom Configuration
      run: |
        [ -f $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config

        chmod +x $DIY_P2_SH

        cd openwrt

        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Generate Configuration
      run: |
        cd openwrt

        make defconfig

        grep "^CONFIG_TARGET" .config || true

        echo "===== DEVICE ====="

        grep "360t7" .config || true

    - name: Check Packages
      run: |
        cd openwrt

        find package -iname "*passwall*" || true
        find package -iname "*daed*" || true
        find package -iname "*mosdns*" || true
        find package -iname "*tailscale*" || true

    - name: Download Packages
      run: |
        cd openwrt

        make download -j$(nproc)

        find dl -size -1024c -exec ls -l {} \;

        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      run: |
        cd openwrt

        export CCACHE_DIR=$HOME/.ccache
        export CCACHE_MAXSIZE=2G

        echo "CPU Threads: $(nproc)"

        make -j$(nproc) || make -j1 V=s

    - name: Build Info
      run: |
        cd openwrt

        grep '^CONFIG_TARGET.*DEVICE.*=y' .config \
        | sed -r 's/.*DEVICE_(.*)=y/\1/' \
        > DEVICE_NAME || true

        [ -s DEVICE_NAME ] && \
        echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV

        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check Firmware
      run: |
        cd openwrt

        ls -lh bin/targets/mediatek/filogic/

    - name: Organize Firmware
      run: |
        cd openwrt/bin/targets/mediatek/filogic

        rm -rf packages

        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iStoreOS_360T7${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate Release Info
      id: tag
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT

        cat > release.txt << EOF
        Device: 360T7
        Platform: MT7981 Filogic
        Source: 
