name: iStoreOS-360T7

on:
  workflow_dispatch:
  repository_dispatch:

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-25.12

  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh

  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk
      run: |
        sudo rm -rf \
        /usr/share/dotnet \
        /usr/local/lib/android \
        /opt/ghc

        sudo docker image prune -af

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update

        sudo apt-get install -y \
        ack antlr3 asciidoc autoconf automake autopoint \
        binutils bison build-essential bzip2 ccache \
        cmake cpio curl device-tree-compiler flex \
        gawk gettext gcc-multilib g++-multilib git \
        gperf haveged help2man intltool libc6-dev-i386 \
        libelf-dev libfuse-dev libglib2.0-dev \
        libgmp3-dev libltdl-dev libmpc-dev \
        libmpfr-dev libncurses5-dev \
        libncursesw5-dev libpython3-dev \
        libreadline-dev libssl-dev libtool \
        lrzsz msmtp ninja-build p7zip-full \
        patch pkgconf python3 python3-pyelftools \
        python3-setuptools qemu-utils rsync \
        scons squashfs-tools subversion swig \
        texinfo uglifyjs unzip vim wget xmlto \
        xxd zlib1g-dev

        sudo timedatectl set-timezone "$TZ"

    - name: Clone Source
      run: |
        git clone --depth=1 \
        -b $REPO_BRANCH \
        $REPO_URL openwrt

    - name: Cache dl
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: dl-${{ runner.os }}

    - name: Load Feeds
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a

    - name: Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a

    - name: Load Config
      run: |
        mv $CONFIG_FILE openwrt/.config

        chmod +x $DIY_P2_SH

        cd openwrt

        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Generate Config
      run: |
        cd openwrt

        make defconfig

        grep "^CONFIG_TARGET" .config || true

    - name: Download
      run: |
        cd openwrt

        make download -j$(nproc)

    - name: Compile
      run: |
        cd openwrt

        make -j$(nproc) || make -j1 V=s

    - name: Organize
      run: |
        cd openwrt/bin/targets/mediatek/filogic

        rm -rf packages

        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

        echo "FILE_DATE=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iStoreOS-360T7-${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Release Info
      id: tag
      run: |
        echo "release_tag=$(date +%Y.%m.%d-%H%M)" >> $GITHUB_OUTPUT

        echo "Device: 360T7" > release.txt
        echo "Source: iStoreOS 25.12" >> release.txt
        echo "Build Time: $(date)" >> release.txt

    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
