name: iStoreOS-360T7

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build 360T7 Firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space & Setup Swap
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune -af || true
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo fallocate -l 8G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

    - name: Setup Build Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ack asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache \
          clang cmake cpio curl device-tree-compiler dwarves flex gawk gcc g++ gettext git \
          gperf help2man intltool lld libclang-dev libelf-dev libfuse-dev libglib2.0-dev \
          libgmp-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libreadline-dev \
          libssl-dev libtool llvm make ninja-build patch pkgconf python3 python3-dev \
          python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools \
          subversion swig texinfo unzip wget xmlto xxd zlib1g-dev

        sudo ln -sf "$(which clang)" /usr/bin/clang || true
        sudo ln -sf "$(which llvm-strip 2>/dev/null || which llvm-objcopy 2>/dev/null)" /usr/bin/llvm-strip || true
        sudo ln -sf "/usr/share/zoneinfo/$TZ" /etc/localtime

    - name: Clone Source Code
      run: |
        git clone --depth=1 -b $REPO_BRANCH $REPO_URL openwrt

    - name: Load Feeds & Update
      run: |
        [ -f $FEEDS_CONF ] && cp $FEEDS_CONF openwrt/feeds.conf.default
        [ -f $DIY_P1_SH ] && chmod +x $DIY_P1_SH && cd openwrt && $GITHUB_WORKSPACE/$DIY_P1_SH && cd ..
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Config & Run DIY2
      run: |
        [ -d files ] && cp -a files openwrt/files
        [ -f $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        [ -f $DIY_P2_SH ] && chmod +x $DIY_P2_SH && cd openwrt && $GITHUB_WORKSPACE/$DIY_P2_SH && cd ..
        cd openwrt
        make defconfig
        grep "CONFIG_TARGET_mediatek_filogic_DEVICE_qihoo_360t7" .config || true

    - name: Download Sources
      run: |
        cd openwrt
        make download -j$(nproc)
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      run: |
        cd openwrt
        export CCACHE_DIR="$HOME/.ccache"
        export CCACHE_MAXSIZE=2G
        make -j$(nproc) CLANG=/usr/bin/clang LLVM_STRIP=/usr/bin/llvm-strip || make -j1 V=s CLANG=/usr/bin/clang LLVM_STRIP=/usr/bin/llvm-strip

    - name: Organize Firmware
      run: |
        cd openwrt/bin/targets/mediatek/filogic
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iStoreOS-360T7-$(date +%Y%m%d%H%M)
        path: ${{ env.FIRMWARE }}/*

    - name: Upload Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: iStoreOS-360T7-$(date +%Y%m%d%H%M)
        name: iStoreOS 25.12 for 360T7
        files: ${{ env.FIRMWARE }}/*
