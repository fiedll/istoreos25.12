name: iStoreOS 25.12 - 360T7

on:
  workflow_dispatch:
  repository_dispatch:

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build iStoreOS 25.12 for 360T7
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "===== Disk before cleanup ====="
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          echo "===== Disk after cleanup ====="
          df -h

      - name: Setup swap
        run: |
          sudo swapoff -a || true
          [ -f /swapfile ] && sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "===== Swap ====="
          free -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache \
            clang cmake cpio curl device-tree-compiler dwarves flex gawk gcc g++ gettext git \
            gperf help2man intltool lld libclang-dev libelf-dev libfuse-dev libglib2.0-dev \
            libgmp-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libreadline-dev \
            libssl-dev libtool llvm make ninja-build patch pkgconf python3 python3-dev \
            python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools \
            subversion swig texinfo unzip wget xmlto xxd zlib1g-dev

          sudo ln -sf "$(which clang)" /usr/bin/clang || true
          sudo ln -sf "$(which llvm-strip 2>/dev/null || which llvm-objcopy 2>/dev/null)" /usr/bin/llvm-strip || true
          sudo ln -sf "/usr/share/zoneinfo/$TZ" /etc/localtime

          echo "===== Build environment ====="
          clang --version
          llvm-config --version

      - name: Clone official iStoreOS 25.12 source
        run: |
          git clone --depth=1 --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          if [ ! -d target/linux/mediatek ] || ! grep -Rqs "qihoo_360t7" target/linux/mediatek; then
            echo "ERROR: qihoo_360t7 target not found."
            exit 1
          fi
          echo "360T7 target: FOUND"

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ runner.os }}-${{ hashFiles('.config', 'feeds.conf.default', 'diy-part1.sh', 'diy-part2.sh') }}
          restore-keys: |
            openwrt-dl-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: openwrt-ccache-${{ runner.os }}-${{ hashFiles('.config', 'feeds.conf.default', 'diy-part1.sh', 'diy-part2.sh') }}
          restore-keys: |
            openwrt-ccache-${{ runner.os }}-

      - name: Load custom feeds
        run: |
          [ -f "$FEEDS_CONF" ] && cp "$FEEDS_CONF" openwrt/feeds.conf.default

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a

      - name: Install feeds
        run: |
          cd openwrt
          ./scripts/feeds install -a

      - name: Run DIY Part 1
        run: |
          if [ -f "$DIY_P1_SH" ]; then
            chmod +x "$DIY_P1_SH"
            cd openwrt
            "$GITHUB_WORKSPACE/$DIY_P1_SH"
          fi

      - name: Load files and configuration
        run: |
          [ -d "$GITHUB_WORKSPACE/files" ] && cp -a "$GITHUB_WORKSPACE/files" openwrt/files
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "ERROR: .config not found."
            exit 1
          fi
          cp "$CONFIG_FILE" openwrt/.config

          if [ -f "$DIY_P2_SH" ]; then
            chmod +x "$DIY_P2_SH"
            cd openwrt
            "$GITHUB_WORKSPACE/$DIY_P2_SH"
          fi

      - name: Generate final configuration
        run: |
          cd openwrt
          echo "===== Running make defconfig ====="
          make defconfig

          if ! grep -q "^CONFIG_TARGET_mediatek_filogic_DEVICE_qihoo_360t7=y" .config; then
            echo "ERROR: 360T7 target is NOT enabled."
            exit 1
          fi
          echo "360T7 target: OK"

      - name: Verify package sources
        run: |
          cd openwrt
          find package -maxdepth 6 \( -iname "*daed*" -o -iname "*passwall*" -o -iname "*mosdns*" -o -iname "*tailscale*" \) -print || true

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -type f -size -1024c -exec rm -f {} \;
          make download -j$(nproc)

      - name: Compile firmware
        run: |
          cd openwrt
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_MAXSIZE=2G
          ccache -M 2G || true
          echo "CPU: $(nproc) cores"

          if make -j$(nproc) CLANG=/usr/bin/clang LLVM_STRIP=/usr/bin/llvm-strip; then
            echo "BUILD SUCCESS"
          else
            echo "Retrying with -j1 V=s"
            make -j1 V=s CLANG=/usr/bin/clang LLVM_STRIP=/usr/bin/llvm-strip
          fi

      - name: Verify actual kernel BTF
        run: |
          cd openwrt
          VMLINUX="$(find build_dir -type f -name vmlinux -print -quit)"
          if [ -z "$VMLINUX" ]; then
            echo "ERROR: vmlinux not found."
            exit 1
          fi
          if ! readelf -S "$VMLINUX" | grep -q '\.BTF'; then
            echo "ERROR: vmlinux does not contain .BTF section."
            exit 1
          fi
          echo "Kernel BTF: FOUND"

      - name: Verify 360T7 firmware
        run: |
          cd openwrt
          FIRMWARE_DIR="bin/targets/mediatek/filogic"
          if [ ! -d "$FIRMWARE_DIR" ]; then
            echo "ERROR: Firmware directory does not exist: $FIRMWARE_DIR"
            exit 1
          fi

          find "$FIRMWARE_DIR" -maxdepth 1 -type f -printf '%f\n' | sort

          SYSUPGRADE="$FIRMWARE_DIR/qihoo_360t7-squashfs-sysupgrade.itb"
          RECOVERY="$FIRMWARE_DIR/qihoo_360t7-initramfs-recovery.itb"

          for file in "$SYSUPGRADE" "$RECOVERY"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing firmware: $file"
              exit 1
            fi
          done

          ls -lh "$FIRMWARE_DIR"/qihoo_360t7-*
          sha256sum "$FIRMWARE_DIR"/qihoo_360t7-*

      - name: Generate build information
        run: |
          cd openwrt
          {
            echo "iStoreOS 25.12 - Qihoo 360T7"
            echo "Build date: $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "Target: mediatek/filogic/qihoo_360t7"
          } > build-info.txt

      - name: Organize firmware
        run: |
          cd openwrt/bin/targets/mediatek/filogic
          rm -rf packages
          cp "$GITHUB_WORKSPACE/openwrt/.config" ./build.config
          [ -f "$GITHUB_WORKSPACE/diy-part2.sh" ] && cp "$GITHUB_WORKSPACE/diy-part2.sh" ./build-diy-part2.sh
          cp "$GITHUB_WORKSPACE/openwrt/build-info.txt" ./build-info.txt
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-25.12-360T7
          path: |
            ${{ env.FIRMWARE }}/qihoo_360t7-*
            ${{ env.FIRMWARE }}/sha256sums
            ${{ env.FIRMWARE }}/build.config
            ${{ env.FIRMWARE }}/build-diy-part2.sh
            ${{ env.FIRMWARE }}/build-info.txt
          if-no-files-found: error

      - name: Generate release information
        id: release
        run: |
          DATE="$(date '+%Y%m%d-%H%M')"
          TAG="iStoreOS-25.12-360T7-${DATE}-${GITHUB_RUN_NUMBER}"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          cat > release.txt << EOF
iStoreOS 25.12 - Qihoo 360T7
Target: mediatek / filogic / qihoo_360t7
Build date: $(date '+%Y-%m-%d %H:%M:%S %Z')
GitHub Actions run: ${GITHUB_RUN_NUMBER}

Firmware Files:
- qihoo_360t7-squashfs-sysupgrade.itb
- qihoo_360t7-initramfs-recovery.itb

Features:
- eBPF + BTF 内核已开启并校验
- Daed, PassWall, MosDNS v5, Tailscale 全集成
EOF

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release.outputs.release_tag }}
          name: iStoreOS 25.12 - 360T7
          body_path: release.txt
          files: |
            ${{ env.FIRMWARE }}/qihoo_360t7-*
            ${{ env.FIRMWARE }}/sha256sums
            ${{ env.FIRMWARE }}/build.config
            ${{ env.FIRMWARE }}/build-diy-part2.sh
            ${{ env.FIRMWARE }}/build-info.txt
